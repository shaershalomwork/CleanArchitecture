extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
    fsync: true
    compaction:
      on_start: true
      on_rebound: true
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /run/secrets/tls.crt
          key_file: /run/secrets/tls.key
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 128
  transform/privacy:
    error_mode: propagate
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment.name"])
          - set(attributes["data_stream.dataset"], "webapi")
          - set(attributes["data_stream.namespace"], "${env:LOG_ENVIRONMENT}")
      - context: scope
        statements:
          - keep_keys(attributes, [])
          - set(attributes["elastic.mapping.mode"], "otel")
      - context: log
        statements:
          - keep_keys(attributes, ["TraceId", "CorrelationId", "UseCase", "Outcome", "ElapsedMs", "Source", "Operation", "Code", "ExceptionType", "StatusCode"])
exporters:
  elasticsearch:
    endpoint: ${env:ELASTICSEARCH_ENDPOINT}
    api_key: ${file:/run/secrets/elasticsearch-api-key}
    tls:
      ca_file: /run/secrets/elasticsearch-ca.crt
    mapping:
      allowed_modes: [otel]
    include_source_on_error: false
    # This exporter applies timeout to the entire bulk flush, including retries.
    # Keep it above the one-hour outage budget or queued batches are discarded early.
    timeout: 75m
    retry:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_retries: 240
      retry_on_status: [429, 500, 502, 503, 504]
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 4294967296
      num_consumers: 2
      block_on_overflow: true
      batch:
        sizer: bytes
        min_size: 262144
        max_size: 1048576
        flush_timeout: 1s
service:
  extensions: [health_check, file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy]
      exporters: [elasticsearch]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
