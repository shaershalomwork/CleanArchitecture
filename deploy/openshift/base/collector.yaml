apiVersion: v1
kind: ServiceAccount
metadata: {name: otel-collector}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: {app: otel-collector}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: otel-collector-tls
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8888, targetPort: metrics}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector-headless}
spec:
  clusterIP: None
  selector: {app: otel-collector}
  ports: [{name: otlp-http, port: 4318, targetPort: otlp-http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: otel-collector}
spec:
  serviceName: otel-collector-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: otel-collector}
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.153.0
          args: ['--config=/etc/otelcol/config.yaml']
          envFrom: [{configMapRef: {name: logging-environment}}]
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
            - {name: health, containerPort: 13133}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /, port: health}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: health}
          readinessProbe:
            httpGet: {path: /, port: health}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: buffer, mountPath: /var/lib/otelcol}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: collector-config}
        - name: secrets
          projected:
            sources:
              - secret:
                  name: otel-collector-tls
              - secret:
                  name: logging-elasticsearch
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
  volumeClaimTemplates:
    - metadata: {name: buffer}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: otel-collector}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: otel-collector}
