apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: collector-ingress}
spec:
  podSelector:
    matchLabels: {app: otel-collector}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: webapi}
      ports: [{protocol: TCP, port: 4318}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-user-workload-monitoring}
      ports: [{protocol: TCP, port: 8888}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: application-ingress}
spec:
  podSelector:
    matchLabels: {app: webapi}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {network.openshift.io/policy-group: ingress}
      ports: [{protocol: TCP, port: 8443}]
