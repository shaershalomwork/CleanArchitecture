apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: integration-production
resources: [../../base]
patches:
  - target: {kind: Route, name: webapi}
    patch: |-
      - op: replace
        path: /spec/host
        value: replace-production-app.example
      - op: replace
        path: /metadata/labels/route-visibility
        value: replace-production-private-ingress-label
  - target: {kind: Deployment, name: webapi}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/httpHeaders/0/value
        value: replace-production-app.example
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
        value: replace-production-app.example
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
        value: replace-production-app.example
replicas:
  - {name: otel-collector, count: 2}
configMapGenerator:
  - name: keycloak-ca
    literals:
      - ca.crt=replace-with-production-keycloak-ca-pem
  - name: logging-environment
    literals:
      - LOG_ENVIRONMENT=production
      - ELASTICSEARCH_ENDPOINT=https://replace-production-elasticsearch.example:9200
  - name: application-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=https://otel-collector.integration-production.svc:4318/v1/logs
      - Authentication__Authority=https://replace-production-identity.example
      - Authentication__Audience=replace-production-audience
      - Authentication__PublicOrigin=https://replace-production-app.example/
      - Authentication__DataProtectionApplicationName=replace-app-production
      - Authentication__TrustedProxies__0=192.0.2.1
      - ASPNETCORE_ALLOWEDHOSTS=replace-production-app.example
      - Authentication__ClientId=replace-production-browser-client-id
      - Sources__Billing__BaseUrl=https://replace-production-billing.example/
