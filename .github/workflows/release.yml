name: Release organizational template
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/build.yml
  templates:
    uses: ./.github/workflows/test-templates.yml
    with:
      version: ${{ github.ref_name }}
  publish:
    needs: [verify, templates]
    environment: template-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: tested-package-None-SqlServer
          path: artifacts/template-packages
      - name: Publish tested package to configured organizational feed
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TEMPLATE_FEED_URL: ${{ vars.TEMPLATE_FEED_URL }}
          TEMPLATE_FEED_API_KEY: ${{ secrets.TEMPLATE_FEED_API_KEY }}
        run: |
          if (!$env:TEMPLATE_FEED_URL -or !$env:TEMPLATE_FEED_API_KEY) { throw 'Configure the organizational feed before releasing.' }
          $version = $env:RELEASE_TAG.TrimStart('v')
          $package = Get-Item "artifacts/template-packages/DataCentric.Integration.Solution.Template.$version.nupkg"
          dotnet nuget push $package.FullName --source $env:TEMPLATE_FEED_URL --api-key $env:TEMPLATE_FEED_API_KEY --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'Package publication failed.' }
