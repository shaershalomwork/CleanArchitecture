name: Test packaged templates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.1.0'
permissions:
  contents: read
jobs:
  templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [None, Angular]
        provider: [SqlServer, SQLite, Oracle]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Verify actual package and published application
        shell: pwsh
        env:
          TEMPLATE_VERSION: ${{ inputs.version || '0.1.0' }}
          TEMPLATE_CLIENT: ${{ matrix.client }}
          CUSTOMER_PROVIDER: ${{ matrix.provider }}
        run: ./build/test.ps1 -ClientFramework $env:TEMPLATE_CLIENT -CustomerProvider $env:CUSTOMER_PROVIDER -Version $env:TEMPLATE_VERSION.TrimStart('v') -BrowserTests
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: tested-package-${{ matrix.client }}-${{ matrix.provider }}
          path: artifacts/template-packages/*.nupkg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: template-logs-${{ matrix.client }}-${{ matrix.provider }}
          path: |
            artifacts/template-tests/**/server*.log
            artifacts/template-tests/**/screenshots/*.png
