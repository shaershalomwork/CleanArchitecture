name: Build
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Offline verification
        shell: pwsh
        run: ./build/verify.ps1
      - name: Disposable SQL source contracts
        shell: pwsh
        run: ./build/verify.ps1 -SourceIntegration
