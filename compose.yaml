name: cleanarchitecture-logging
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic-password
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'true'
      xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/tls.key
      xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/tls.crt
      xpack.security.http.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca.crt
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
      - ./.local/logging/certs:/usr/share/elasticsearch/config/certs:ro
    secrets: [elastic-password]
    ports: ['127.0.0.1:9200:9200']
    mem_limit: 2g
    healthcheck:
      test: ['CMD-SHELL', 'curl -s --cacert config/certs/ca.crt https://localhost:9200 | grep -q "missing authentication credentials"']
      interval: 10s
      timeout: 5s
      retries: 30
    logging: &rotation
      driver: json-file
      options: {max-size: 20m, max-file: '5'}

  elastic-setup:
    image: node:24.13.0-bookworm-slim
    entrypoint: [node, /setup/bootstrap.mjs]
    environment:
      ELASTICSEARCH_ENDPOINT: https://elasticsearch:9200
      LOG_ENVIRONMENT: development
      LOG_RETENTION_DAYS: '7'
      LOG_REPLICAS: '0'
      LOCAL_SETUP: 'true'
    volumes:
      - ./deploy/elasticsearch:/setup:ro
      - ./.local/logging:/local
    depends_on:
      elasticsearch: {condition: service_healthy}
    logging: *rotation

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      ELASTICSEARCH_ENDPOINT: https://elasticsearch:9200
      LOG_ENVIRONMENT: development
    volumes:
      - ./deploy/collector/config.yaml:/etc/otelcol/config.yaml:ro
      - ./.local/logging/collector-secrets:/run/secrets:ro
      - collector-data:/var/lib/otelcol
    # Named volumes are initialized with the non-root owner's directory from this helper.
    user: '10001:0'
    depends_on:
      elastic-setup: {condition: service_completed_successfully}
      collector-storage: {condition: service_completed_successfully}
    mem_limit: 1g
    ports: ['127.0.0.1:13133:13133', '127.0.0.1:8888:8888']
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *rotation

  collector-storage:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    user: '0:0'
    entrypoint: [bash, -c, 'chown 10001:0 /var/lib/otelcol && chmod 770 /var/lib/otelcol']
    volumes: [collector-data:/var/lib/otelcol]

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    environment:
      ELASTICSEARCH_HOSTS: '["https://elasticsearch:9200"]'
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /certs/ca.crt
      SERVER_HOST: 0.0.0.0
      SERVER_SSL_ENABLED: 'true'
      SERVER_SSL_CERTIFICATE: /certs/tls.crt
      SERVER_SSL_KEY: /certs/tls.key
    volumes:
      - ./.local/logging/certs:/certs:ro
      - ./.local/logging/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports: ['127.0.0.1:5601:5601']
    depends_on:
      elastic-setup: {condition: service_completed_successfully}
    mem_limit: 2g
    logging: *rotation

  web:
    image: cleanarchitecture-web:local
    build:
      context: .
      args:
        SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0-local}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /certs/tls.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /certs/tls.key
      OTEL_SERVICE_NAME: webapi
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: https://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_CERTIFICATE: /certs/ca.crt
      OTEL_BLRP_MAX_QUEUE_SIZE: '8192'
      OTEL_BLRP_MAX_EXPORT_BATCH_SIZE: '512'
      OTEL_BLRP_SCHEDULE_DELAY: '1000'
    volumes: ['./.local/logging/certs:/certs:ro']
    ports: ['127.0.0.1:8443:8443']
    depends_on:
      otel-collector: {condition: service_started}
    stop_grace_period: 30s
    logging: *rotation

secrets:
  elastic-password:
    file: ./.local/logging/elastic-password
volumes:
  elastic-data:
  collector-data:
